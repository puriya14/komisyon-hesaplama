# Bahis Tahmin: otomatik testler.
# - push / pull_request: yalnızca testler (Ubuntu, ekransız Qt). Hiçbir paket, ZIP veya sürüm oluşturulmaz.
# - Elle tetikleme (workflow_dispatch) + "build_exe" işaretliyse: Windows'ta testler ve PyInstaller derlemesinin
#   başarıyla tamamlandığı doğrulanır. Derleme çıktısı YÜKLENMEZ (yayın paketi oluşturmak ayrı onay gerektirir).
name: bahis-tahmin

on:
  push:
    paths:
      - "bahis-tahmin/**"
      - ".github/workflows/bahis-tahmin.yml"
  pull_request:
    paths:
      - "bahis-tahmin/**"
      - ".github/workflows/bahis-tahmin.yml"
  workflow_dispatch:
    inputs:
      build_exe:
        description: "Windows .exe derlemesini doğrula (çıktı yüklenmez)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bahis-tahmin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bahis-tahmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bahis-tahmin/requirements*.txt
      - name: Qt için sistem kütüphaneleri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt pytest
      - name: Testler (ağ testleri hariç)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  windows-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_exe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bahis-tahmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bağımlılıklar
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Testler
        run: python -m pytest -q
      - name: PyInstaller derlemesi
        run: pyinstaller --noconfirm --clean BahisTahmin.spec
      - name: Derleme çıktısını doğrula
        shell: pwsh
        run: |
          if (-not (Test-Path dist/BahisTahmin/BahisTahmin.exe)) { throw "BahisTahmin.exe oluşmadı" }
          Get-Item dist/BahisTahmin/BahisTahmin.exe | Select-Object Name, Length
