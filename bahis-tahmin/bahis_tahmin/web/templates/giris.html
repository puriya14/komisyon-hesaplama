{% extends "base.html" %}
{% from "macros.html" import csrf_field with context %}
{% block title %}Giriş{% endblock %}
{% block content %}
<h1>Giriş</h1>
<p class="sub">Bu sunucu ağda paylaşılıyor; devam etmek için parolayı girin.</p>
{% if hata %}<div class="msg bad">{{ hata }}</div>{% endif %}
<form method="post" action="{{ url_for('views.giris') }}" class="panel narrow">{{ csrf_field() }}
  <input type="hidden" name="sonra" value="{{ sonra }}">
  <label>Parola <input type="password" name="parola" autocomplete="current-password" required autofocus></label>
  <button class="btn primary" type="submit">Giriş</button>
</form>
{% endblock %}
